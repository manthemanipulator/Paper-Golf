<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paper Apps Golf Companion</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 { margin-top: 5px; margin-bottom: 5px; font-size: 22px; }
        
        .header-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 350px;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 16px;
            color: #2c3e50;
        }

        .dice-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            width: 100%;
            max-width: 350px;
        }
        #diceResult {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #2c3e50;
            transition: transform 0.1s;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        button {
            flex: 1;
            background-color: #007aff;
            color: white;
            border: none;
            padding: 12px 10px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            touch-action: manipulation;
        }
        button:active { background-color: #005bb5; }
        button:disabled {
            background-color: #cccccc !important;
            color: #666666 !important;
            cursor: not-allowed;
        }

        .btn-putt { background-color: #ff9500; }
        .btn-putt:active { background-color: #cc7700; }

        .btn-secondary {
            background-color: #34c759;
            margin-top: 10px;
            width: 100%;
        }
        .btn-secondary:active { background-color: #248a3d; }
        
        .map-container {
            background: white;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 350px;
            box-sizing: border-box;
        }
        
        .canvas-wrapper {
            position: relative;
            width: fit-content;
        }

        .victory-screen {
            display: none; 
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.9);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            z-index: 10;
        }
        .victory-screen h2 { color: #2c3e50; font-size: 28px; margin-bottom: 5px; }
        .victory-screen p { color: #666; font-size: 18px; font-weight: bold; }

        canvas {
            background-color: #fcfcfc;
            border: 1px solid #ddd;
            border-radius: 8px;
            touch-action: none; 
            cursor: crosshair;
            display: block; 
        }
        .instructions {
            font-size: 13px;
            color: #d9534f; 
            font-weight: bold;
            margin-top: 8px;
            margin-bottom: 4px;
            height: 18px; 
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>GOLF Companion</h1>
    
    <div class="header-bar">
        <span id="holeDisplay">Hole: 1</span>
        <span id="strokeDisplay">Strokes: 0</span>
    </div>

    <div class="dice-container">
        <div id="diceResult">-</div>
        <div class="button-group">
            <button id="rollBtn">Roll d6</button>
            <button id="puttBtn" class="btn-putt">Putt (1)</button>
        </div>
    </div>

    <div class="map-container">
        <div class="canvas-wrapper">
            <div id="victoryOverlay" class="victory-screen">
                <h2>IN THE HOLE!</h2>
                <p id="finalScoreText">Score: 3 (Par 6)</p>
            </div>
            <canvas id="courseMap" width="300" height="400"></canvas>
        </div>
        
        <p id="statusText" class="instructions">Choose your shot type to start!</p>
        <button id="generateBtn" class="btn-secondary">Generate Next Hole</button>
    </div>

    <script>
        // --- GAME STATE VARIABLES ---
        let currentHole = 1;
        let strokes = 0;
        let currentRoll = 0;
        let canShoot = false;
        let isPutting = false;
        let isHoleComplete = false;
        
        let currentBallPos = { x: 0, y: 0 };
        let holePos = { x: 0, y: 0 };

        // --- DOM ELEMENTS ---
        const rollBtn = document.getElementById('rollBtn');
        const puttBtn = document.getElementById('puttBtn');
        const diceResult = document.getElementById('diceResult');
        const statusText = document.getElementById('statusText');
        const strokeDisplay = document.getElementById('strokeDisplay');
        const holeDisplay = document.getElementById('holeDisplay');
        const generateBtn = document.getElementById('generateBtn');
        const victoryOverlay = document.getElementById('victoryOverlay');
        const finalScoreText = document.getElementById('finalScoreText');
        
        const canvas = document.getElementById('courseMap');
        const ctx = canvas.getContext('2d');

        const TILE_SIZE = 20;
        const COLS = canvas.width / TILE_SIZE;
        const ROWS = canvas.height / TILE_SIZE;

        const COLORS = {
            rough: '#e9f5e9',
            fairway: '#90ee90',
            sand: '#f5deb3',
            water: '#4682b4',
            tree: '#228b22',
            dot: 'rgba(0, 0, 0, 0.15)' 
        };

        // --- ACTION BUTTON LOGIC ---
        function animateDice(text) {
            diceResult.innerText = text;
            diceResult.style.transform = 'scale(1.3)';
            setTimeout(() => diceResult.style.transform = 'scale(1)', 150);
        }

        rollBtn.addEventListener('click', () => {
            if (isHoleComplete) return;
            currentRoll = Math.floor(Math.random() * 6) + 1;
            animateDice(currentRoll);

            canShoot = true;
            isPutting = false;
            rollBtn.disabled = true; 
            puttBtn.disabled = true;
            statusText.style.color = '#5cb85c'; 
            statusText.innerText = "Tap the grid to take your shot!";
        });

        puttBtn.addEventListener('click', () => {
            if (isHoleComplete) return;
            currentRoll = 1; 
            animateDice('P');

            canShoot = true;
            isPutting = true;
            rollBtn.disabled = true;
            puttBtn.disabled = true;
            statusText.style.color = '#ff9500'; 
            statusText.innerText = "Tap an adjacent dot to putt.";
        });

        // --- MAP GENERATION ---
        function generateCourse() {
            victoryOverlay.style.display = 'none';

            // 1. Draw Rough (Background)
            ctx.fillStyle = COLORS.rough;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Draw Fairway
            ctx.fillStyle = COLORS.fairway;
            let currentX = Math.floor(COLS / 2);
            let currentY = ROWS - 2;
            const startX = currentX;
            const startY = currentY;

            while (currentY > 2) {
                ctx.fillRect((currentX - 1) * TILE_SIZE, (currentY - 1) * TILE_SIZE, TILE_SIZE * 3, TILE_SIZE * 3);
                let move = Math.random();
                if (move < 0.5) currentY -= 1;
                else if (move < 0.75 && currentX > 2) currentX -= 1;
                else if (currentX < COLS - 3) currentX += 1;
            }
            
            holePos = { x: currentX * TILE_SIZE, y: currentY * TILE_SIZE };

            // 3. Draw Hazards
            for(let i = 0; i < 5; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? COLORS.water : COLORS.sand;
                let hx = Math.floor(Math.random() * (COLS - 2)) + 1;
                let hy = Math.floor(Math.random() * (ROWS - 4)) + 2;
                ctx.fillRect(hx * TILE_SIZE, hy * TILE_SIZE, TILE_SIZE * 2, TILE_SIZE * 2);
            }

            // 4. DRAW DOTS 
            ctx.fillStyle = COLORS.dot;
            for(let y = 0; y <= ROWS; y++) {
                for(let x = 0; x <= COLS; x++) {
                    ctx.beginPath();
                    ctx.arc(x * TILE_SIZE, y * TILE_SIZE, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // 5. Draw Trees
            ctx.fillStyle = COLORS.tree;
            for(let i = 0; i < 15; i++) {
                let tx = Math.floor(Math.random() * COLS);
                let ty = Math.floor(Math.random() * ROWS);
                ctx.beginPath();
                ctx.moveTo(tx * TILE_SIZE + (TILE_SIZE/2), ty * TILE_SIZE);
                ctx.lineTo(tx * TILE_SIZE + TILE_SIZE, ty * TILE_SIZE + TILE_SIZE);
                ctx.lineTo(tx * TILE_SIZE, ty * TILE_SIZE + TILE_SIZE);
                ctx.fill();
            }

            // 6. Draw Hole (Bug Fix: Positioned exactly on the grid dot intersection)
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(holePos.x, holePos.y, 7, 0, Math.PI * 2);
            ctx.fill();

            // Set Ball Position
            currentBallPos = { x: startX * TILE_SIZE, y: startY * TILE_SIZE };
            drawBall(currentBallPos.x, currentBallPos.y, true);
            
            resetTurn(true);
        }

        function drawBall(x, y, isStart = false) {
            ctx.beginPath();
            ctx.arc(x, y, 5, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();
            ctx.strokeStyle = isStart ? 'black' : 'red';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function resetTurn(isNewHole = false) {
            canShoot = false;
            isPutting = false;
            rollBtn.disabled = false;
            puttBtn.disabled = false;
            currentRoll = 0;
            diceResult.innerText = '-';
            statusText.style.color = '#d9534f';
            statusText.innerText = "Choose your shot type to continue.";
            
            if (isNewHole) {
                strokes = 0;
                isHoleComplete = false;
                strokeDisplay.innerText = `Strokes: ${strokes}`;
                holeDisplay.innerText = `Hole: ${currentHole}`;
                statusText.innerText = "Choose your shot type to start!";
            }
        }

        function triggerVictory() {
            isHoleComplete = true;
            canShoot = false;
            rollBtn.disabled = true;
            puttBtn.disabled = true;
            statusText.style.color = '#5cb85c';
            statusText.innerText = "Hole completed!";
            
            finalScoreText.innerText = `Score: ${strokes} (Par 6)`;
            victoryOverlay.style.display = 'flex';
        }

        // --- VALIDATION & COLLISION ENGINE ---
        canvas.addEventListener('pointerdown', (e) => {
            if (!canShoot || isHoleComplete) {
                statusText.style.transform = 'scale(1.1)';
                setTimeout(() => statusText.style.transform = 'scale(1)', 150);
                return;
            }

            const rect = canvas.getBoundingClientRect();
            const tapX = e.clientX - rect.left;
            const tapY = e.clientY - rect.top;

            const gridX = Math.round(tapX / TILE_SIZE) * TILE_SIZE;
            const gridY = Math.round(tapY / TILE_SIZE) * TILE_SIZE;

            const dxSpaces = (gridX - currentBallPos.x) / TILE_SIZE;
            const dySpaces = (gridY - currentBallPos.y) / TILE_SIZE;
            
            const absDx = Math.abs(dxSpaces);
            const absDy = Math.abs(dySpaces);

            if (absDx !== 0 && absDy !== 0 && absDx !== absDy) {
                alert("Invalid hit! Must move in a straight line.");
                return;
            }

            const distanceMoved = Math.max(absDx, absDy);
            if (distanceMoved === 0) return; 

            if (isPutting && distanceMoved > 1) {
                alert("Putting only allows you to move exactly 1 space!");
                return;
            }

            if (!isPutting && distanceMoved > 1 && distanceMoved > currentRoll + 1) {
                alert(`Shot too far! You rolled a ${currentRoll}. You can only move up to ${currentRoll + 1} spaces.`);
                return;
            }

            strokes++;
            strokeDisplay.innerText = `Strokes: ${strokes}`;

            ctx.beginPath();
            ctx.moveTo(currentBallPos.x, currentBallPos.y);
            ctx.lineTo(gridX, gridY);
            ctx.strokeStyle = '#ff3b30'; 
            ctx.lineWidth = 2;
            ctx.stroke();

            drawBall(gridX, gridY);

            const steps = distanceMoved;
            const stepX = dxSpaces / steps;
            const stepY = dySpaces / steps;

            let sankIt = false;

            for(let i = 1; i <= steps; i++) {
                let checkX = currentBallPos.x + (stepX * i * TILE_SIZE);
                let checkY = currentBallPos.y + (stepY * i * TILE_SIZE);
                
                if (Math.abs(checkX - holePos.x) < 1 && Math.abs(checkY - holePos.y) < 1) {
                    let overshoot = steps - i;
                    if (overshoot === 0 || overshoot === 1) {
                        sankIt = true;
                    }
                    break; 
                }
            }

            currentBallPos = { x: gridX, y: gridY };

            if (sankIt) {
                triggerVictory();
            } else {
                resetTurn();
            }
        });

        generateBtn.addEventListener('click', () => {
            if (isHoleComplete) {
                currentHole++; 
            }
            generateCourse();
        });
        
        generateCourse();
    </script>
</body>
</html>
