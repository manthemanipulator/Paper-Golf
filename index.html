<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paper Apps Golf Companion</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 { margin-top: 5px; margin-bottom: 5px; font-size: 22px; }
        
        .header-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 350px;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 16px;
            color: #2c3e50;
        }

        .dice-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            width: 100%;
            max-width: 350px;
        }
        #diceResult {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #2c3e50;
            transition: transform 0.1s;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        button {
            flex: 1;
            background-color: #007aff;
            color: white;
            border: none;
            padding: 12px 10px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            touch-action: manipulation;
        }
        button:active { background-color: #005bb5; }
        button:disabled {
            background-color: #cccccc !important;
            color: #666666 !important;
            cursor: not-allowed;
        }

        .btn-putt { background-color: #ff9500; }
        .btn-putt:active { background-color: #cc7700; }

        .btn-secondary {
            background-color: #34c759;
            margin-top: 10px;
            width: 100%;
        }
        .btn-secondary:active { background-color: #248a3d; }
        
        .map-container {
            background: white;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 350px;
            box-sizing: border-box;
        }
        
        .canvas-wrapper {
            position: relative;
            width: fit-content;
        }

        .victory-screen {
            display: none; 
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.9);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            z-index: 10;
        }
        .victory-screen h2 { color: #2c3e50; font-size: 28px; margin-bottom: 5px; }
        .victory-screen p { color: #666; font-size: 18px; font-weight: bold; }

        canvas {
            background-color: #fcfcfc;
            border: 1px solid #ddd;
            border-radius: 8px;
            touch-action: none; 
            cursor: crosshair;
            display: block; 
        }
        .instructions {
            font-size: 13px;
            color: #d9534f; 
            font-weight: bold;
            margin-top: 8px;
            margin-bottom: 4px;
            height: 18px; 
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>GOLF Companion</h1>
    
    <div class="header-bar">
        <span id="holeDisplay">Hole: 1</span>
        <span id="strokeDisplay">Strokes: 0</span>
    </div>

    <div class="dice-container">
        <div id="diceResult">-</div>
        <div class="button-group">
            <button id="rollBtn">Roll d6</button>
            <button id="puttBtn" class="btn-putt">Putt (1)</button>
        </div>
    </div>

    <div class="map-container">
        <div class="canvas-wrapper">
            <div id="victoryOverlay" class="victory-screen">
                <h2>IN THE HOLE!</h2>
                <p id="finalScoreText">Score: 3 (Par 6)</p>
            </div>
            <canvas id="courseMap" width="300" height="400"></canvas>
        </div>
        
        <p id="statusText" class="instructions">Choose your shot type to start!</p>
        <button id="generateBtn" class="btn-secondary">Generate Next Hole</button>
    </div>

    <script>
        // --- GAME STATE VARIABLES ---
        let currentHole = 1;
        let strokes = 0;
        let currentRoll = 0;
        let canShoot = false;
        let isPutting = false;
        let isHoleComplete = false;
        
        let currentBallPos = { x: 0, y: 0 };
        let holePos = { x: 0, y: 0 };

        // NEW: The internal data grid
        let gridData = [];

        // --- DOM ELEMENTS ---
        const rollBtn = document.getElementById('rollBtn');
        const puttBtn = document.getElementById('puttBtn');
        const diceResult = document.getElementById('diceResult');
        const statusText = document.getElementById('statusText');
        const strokeDisplay = document.getElementById('strokeDisplay');
        const holeDisplay = document.getElementById('holeDisplay');
        const generateBtn = document.getElementById('generateBtn');
        const victoryOverlay = document.getElementById('victoryOverlay');
        const finalScoreText = document.getElementById('finalScoreText');
        
        const canvas = document.getElementById('courseMap');
        const ctx = canvas.getContext('2d');

        const TILE_SIZE = 20;
        const COLS = canvas.width / TILE_SIZE;
        const ROWS = canvas.height / TILE_SIZE;

        const TERRAIN = {
            ROUGH: 0,
            FAIRWAY: 1,
            SAND: 2,
            WATER: 3,
            TREE: 4
        };

        const COLORS = {
            [TERRAIN.ROUGH]: '#e9f5e9',
            [TERRAIN.FAIRWAY]: '#90ee90',
            [TERRAIN.SAND]: '#f5deb3',
            [TERRAIN.WATER]: '#4682b4',
            [TERRAIN.TREE]: '#228b22',
            dot: 'rgba(0, 0, 0, 0.15)' 
        };

        // --- ACTION BUTTON LOGIC ---
        function animateDice(text) {
            diceResult.innerText = text;
            diceResult.style.transform = 'scale(1.3)';
            setTimeout(() => diceResult.style.transform = 'scale(1)', 150);
        }

        rollBtn.addEventListener('click', () => {
            if (isHoleComplete) return;
            currentRoll = Math.floor(Math.random() * 6) + 1;
            animateDice(currentRoll);

            canShoot = true;
            isPutting = false;
            rollBtn.disabled = true; 
            puttBtn.disabled = true;
            
            // Check current terrain to update prompt
            let cGridX = currentBallPos.x / TILE_SIZE;
            let cGridY = currentBallPos.y / TILE_SIZE;
            let currentTerrain = gridData[cGridY][cGridX];
            
            let effectiveRoll = currentRoll;
            let modifierText = "";
            
            if (currentTerrain === TERRAIN.FAIRWAY) {
                effectiveRoll += 1;
                modifierText = " (+1 Fairway Bonus)";
            } else if (currentTerrain === TERRAIN.SAND) {
                effectiveRoll = Math.max(1, currentRoll - 1);
                modifierText = " (-1 Sand Penalty)";
            }

            statusText.style.color = '#5cb85c'; 
            statusText.innerText = `Max distance: ${effectiveRoll}${modifierText}`;
        });

        puttBtn.addEventListener('click', () => {
            if (isHoleComplete) return;
            currentRoll = 1; 
            animateDice('P');

            canShoot = true;
            isPutting = true;
            rollBtn.disabled = true;
            puttBtn.disabled = true;
            statusText.style.color = '#ff9500'; 
            statusText.innerText = "Tap an adjacent dot to putt.";
        });

        // --- MAP GENERATION ---
        function generateCourse() {
            victoryOverlay.style.display = 'none';

            // Reset and build the invisible data grid
            gridData = [];
            for(let y = 0; y <= ROWS; y++) {
                gridData[y] = [];
                for(let x = 0; x <= COLS; x++) {
                    gridData[y][x] = TERRAIN.ROUGH;
                }
            }

            // Generate Fairway in data
            let currentX = Math.floor(COLS / 2);
            let currentY = ROWS - 2;
            const startX = currentX;
            const startY = currentY;

            while (currentY > 2) {
                // Mark 3x3 block as fairway
                for(let fy = currentY - 1; fy <= currentY + 1; fy++) {
                    for(let fx = currentX - 1; fx <= currentX + 1; fx++) {
                        if(gridData[fy] && gridData[fy][fx] !== undefined) {
                            gridData[fy][fx] = TERRAIN.FAIRWAY;
                        }
                    }
                }
                
                let move = Math.random();
                if (move < 0.5) currentY -= 1;
                else if (move < 0.75 && currentX > 2) currentX -= 1;
                else if (currentX < COLS - 3) currentX += 1;
            }
            holePos = { x: currentX * TILE_SIZE, y: currentY * TILE_SIZE };

            // Generate Hazards in data
            for(let i = 0; i < 5; i++) {
                let isWater = Math.random() > 0.5;
                let type = isWater ? TERRAIN.WATER : TERRAIN.SAND;
                let hx = Math.floor(Math.random() * (COLS - 2)) + 1;
                let hy = Math.floor(Math.random() * (ROWS - 4)) + 2;
                
                for(let fy = hy; fy < hy + 2; fy++) {
                    for(let fx = hx; fx < hx + 2; fx++) {
                        if(gridData[fy] && gridData[fy][fx] !== undefined) {
                            gridData[fy][fx] = type;
                        }
                    }
                }
            }

            // Generate Trees in data
            for(let i = 0; i < 15; i++) {
                let tx = Math.floor(Math.random() * COLS);
                let ty = Math.floor(Math.random() * ROWS);
                // Ensure trees don't spawn exactly on the hole or tee
                if ((tx !== startX || ty !== startY) && (tx !== holePos.x/TILE_SIZE || ty !== holePos.y/TILE_SIZE)) {
                    if(gridData[ty] && gridData[ty][tx] !== undefined) {
                        gridData[ty][tx] = TERRAIN.TREE;
                    }
                }
            }

            // === DRAWING PHASE (Using the data grid) ===
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw Tiles
            for(let y = 0; y < ROWS; y++) {
                for(let x = 0; x < COLS; x++) {
                    let tile = gridData[y][x];
                    if (tile === TERRAIN.TREE) {
                        // Fill background with whatever it overwrote? No, just draw tree over rough
                        ctx.fillStyle = COLORS[TERRAIN.ROUGH];
                        ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                        
                        ctx.fillStyle = COLORS[TERRAIN.TREE];
                        ctx.beginPath();
                        ctx.moveTo(x * TILE_SIZE + (TILE_SIZE/2), y * TILE_SIZE);
                        ctx.lineTo(x * TILE_SIZE + TILE_SIZE, y * TILE_SIZE + TILE_SIZE);
                        ctx.lineTo(x * TILE_SIZE, y * TILE_SIZE + TILE_SIZE);
                        ctx.fill();
                    } else {
                        ctx.fillStyle = COLORS[tile];
                        ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                    }
                }
            }

            // Draw Dots 
            ctx.fillStyle = COLORS.dot;
            for(let y = 0; y <= ROWS; y++) {
                for(let x = 0; x <= COLS; x++) {
                    ctx.beginPath();
                    ctx.arc(x * TILE_SIZE, y * TILE_SIZE, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Draw Hole 
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(holePos.x, holePos.y, 7, 0, Math.PI * 2);
            ctx.fill();

            // Setup Start
            currentBallPos = { x: startX * TILE_SIZE, y: startY * TILE_SIZE };
            drawBall(currentBallPos.x, currentBallPos.y, true);
            
            resetTurn(true);
        }

        function drawBall(x, y, isStart = false) {
            ctx.beginPath();
            ctx.arc(x, y, 5, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();
            ctx.strokeStyle = isStart ? 'black' : 'red';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function resetTurn(isNewHole = false) {
            canShoot = false;
            isPutting = false;
            rollBtn.disabled = false;
            puttBtn.disabled = false;
            currentRoll = 0;
            diceResult.innerText = '-';
            statusText.style.color = '#d9534f';
            statusText.innerText = "Choose your shot type to continue.";
            
            if (isNewHole) {
                strokes = 0;
                isHoleComplete = false;
                strokeDisplay.innerText = `Strokes: ${strokes}`;
                holeDisplay.innerText = `Hole: ${currentHole}`;
                statusText.innerText = "Choose your shot type to start!";
            }
        }

        function triggerVictory() {
            isHoleComplete = true;
            canShoot = false;
            rollBtn.disabled = true;
            puttBtn.disabled = true;
            statusText.style.color = '#5cb85c';
            statusText.innerText = "Hole completed!";
            
            finalScoreText.innerText = `Score: ${strokes} (Par 6)`;
            victoryOverlay.style.display = 'flex';
        }

        // --- VALIDATION & COLLISION ENGINE ---
        canvas.addEventListener('pointerdown', (e) => {
            if (!canShoot || isHoleComplete) {
                statusText.style.transform = 'scale(1.1)';
                setTimeout(() => statusText.style.transform = 'scale(1)', 150);
                return;
            }

            const rect = canvas.getBoundingClientRect();
            const tapX = e.clientX - rect.left;
            const tapY = e.clientY - rect.top;

            const gridX = Math.round(tapX / TILE_SIZE) * TILE_SIZE;
            const gridY = Math.round(tapY / TILE_SIZE) * TILE_SIZE;

            const dxSpaces = (gridX - currentBallPos.x) / TILE_SIZE;
            const dySpaces = (gridY - currentBallPos.y) / TILE_SIZE;
            
            const absDx = Math.abs(dxSpaces);
            const absDy = Math.abs(dySpaces);

            // 1. Must be straight line
            if (absDx !== 0 && absDy !== 0 && absDx !== absDy) {
                alert("Invalid hit! Must move in a straight orthogonal or diagonal direction.");
                return;
            }

            const distanceMoved = Math.max(absDx, absDy);
            if (distanceMoved === 0) return; 

            // Establish current terrain
            const startGridX = currentBallPos.x / TILE_SIZE;
            const startGridY = currentBallPos.y / TILE_SIZE;
            const startingTerrain = gridData[startGridY][startGridX];

            // Calculate Effective Roll limit based on starting terrain
            let effectiveRoll = currentRoll;
            if (startingTerrain === TERRAIN.FAIRWAY) {
                effectiveRoll += 1;
            } else if (startingTerrain === TERRAIN.SAND) {
                effectiveRoll = Math.max(1, currentRoll - 1);
            }

            // 2. Distance Validation
            if (isPutting && distanceMoved > 1) {
                alert("Putting only allows you to move exactly 1 space!");
                return;
            }
            if (!isPutting && distanceMoved > effectiveRoll) {
                alert(`Shot too far! With terrain modifiers, your max distance is ${effectiveRoll}.`);
                return;
            }

            // 3. Terrain Crossing Rules (Trees)
            const stepX = dxSpaces / distanceMoved;
            const stepY = dySpaces / distanceMoved;
            
            for(let i = 1; i < distanceMoved; i++) { // Check paths, excluding final landing spot
                let pathX = startGridX + (stepX * i);
                let pathY = startGridY + (stepY * i);
                let pathTerrain = gridData[pathY][pathX];

                if (pathTerrain === TERRAIN.TREE && startingTerrain !== TERRAIN.FAIRWAY) {
                    alert("You cannot shoot through trees unless you are hitting from the Fairway.");
                    return;
                }
            }

            // 4. Landing Spot Rules (Water & Trees)
            const endGridX = startGridX + dxSpaces;
            const endGridY = startGridY + dySpaces;
            // Prevent checking out of bounds
            if (endGridY >= 0 && endGridY <= ROWS && endGridX >= 0 && endGridX <= COLS) {
                 // Because grid dots are intersections, we check the tile to the bottom-right of the dot.
                 // To be perfectly accurate to Paper Apps Golf, landing *on* a dot bordering water/trees is risky.
                 // We'll map the dot coordinate exactly to the grid array index.
                 if (endGridY < ROWS && endGridX < COLS) {
                     let landingTerrain = gridData[endGridY][endGridX];
                     if (landingTerrain === TERRAIN.WATER) {
                         alert("Splash! You cannot land your shot in a Water hazard.");
                         return;
                     }
                     if (landingTerrain === TERRAIN.TREE) {
                         alert("Thwack! You cannot land directly on a Tree.");
                         return;
                     }
                 }
            }

            // === SHOT APPROVED ===
            strokes++;
            strokeDisplay.innerText = `Strokes: ${strokes}`;

            ctx.beginPath();
            ctx.moveTo(currentBallPos.x, currentBallPos.y);
            ctx.lineTo(gridX, gridY);
            ctx.strokeStyle = '#ff3b30'; 
            ctx.lineWidth = 2;
            ctx.stroke();

            drawBall(gridX, gridY);

            // Hole logic
            let sankIt = false;
            for(let i = 1; i <= distanceMoved; i++) {
                let checkX = currentBallPos.x + (stepX * i * TILE_SIZE);
                let checkY = currentBallPos.y + (stepY * i * TILE_SIZE);
                
                if (Math.abs(checkX - holePos.x) < 1 && Math.abs(checkY - holePos.y) < 1) {
                    let overshoot = distanceMoved - i;
                    if (overshoot === 0 || overshoot === 1) {
                        sankIt = true;
                    }
                    break; 
                }
            }

            currentBallPos = { x: gridX, y: gridY };

            if (sankIt) {
                triggerVictory();
            } else {
                resetTurn();
            }
        });

        generateBtn.addEventListener('click', () => {
            if (isHoleComplete) {
                currentHole++; 
            }
            generateCourse();
        });
        
        generateCourse();
    </script>
</body>
</html>
