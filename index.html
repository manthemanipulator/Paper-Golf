<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paper Apps Golf Companion</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 { margin-top: 5px; margin-bottom: 5px; font-size: 22px; }
        
        .header-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 350px;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 15px;
            color: #2c3e50;
        }

        .dice-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            width: 100%;
            max-width: 350px;
        }
        #diceResult {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #2c3e50;
            transition: transform 0.1s;
        }
        
        .button-group {
            display: flex;
            gap: 8px;
            width: 100%;
        }
        button {
            flex: 1;
            background-color: #007aff;
            color: white;
            border: none;
            padding: 12px 5px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            touch-action: manipulation;
        }
        button:active { background-color: #005bb5; }
        button:disabled {
            background-color: #cccccc !important;
            color: #666666 !important;
            cursor: not-allowed;
        }

        .btn-putt { background-color: #ff9500; }
        .btn-putt:active { background-color: #cc7700; }
        
        .btn-reroll { background-color: #8e44ad; }
        .btn-reroll:active { background-color: #732d91; }

        .btn-secondary {
            background-color: #34c759;
            margin-top: 10px;
            width: 100%;
            padding: 12px 10px;
        }
        .btn-secondary:active { background-color: #248a3d; }
        
        .map-container {
            background: white;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 350px;
            box-sizing: border-box;
        }
        
        .canvas-wrapper {
            position: relative;
            width: fit-content;
        }

        .victory-screen {
            display: none; 
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.9);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            z-index: 10;
        }
        .victory-screen h2 { color: #2c3e50; font-size: 28px; margin-bottom: 5px; }
        .victory-screen p { color: #666; font-size: 18px; font-weight: bold; }

        canvas {
            background-color: #fcfcfc;
            border: 1px solid #ddd;
            border-radius: 8px;
            touch-action: none; 
            cursor: crosshair;
            display: block; 
        }
        .instructions {
            font-size: 13px;
            color: #d9534f; 
            font-weight: bold;
            margin-top: 8px;
            margin-bottom: 4px;
            height: 18px; 
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>GOLF Companion</h1>
    
    <div class="header-bar">
        <span id="holeDisplay">Hole: 1</span>
        <span id="mulliganDisplay">Mulligans: 6</span>
        <span id="strokeDisplay">Strokes: 0</span>
    </div>

    <div class="dice-container">
        <div id="diceResult">-</div>
        <div class="button-group">
            <button id="rollBtn">Roll</button>
            <button id="rerollBtn" class="btn-reroll" disabled>Re-roll</button>
            <button id="puttBtn" class="btn-putt">Putt</button>
        </div>
    </div>

    <div class="map-container">
        <div class="canvas-wrapper">
            <div id="victoryOverlay" class="victory-screen">
                <h2>IN THE HOLE!</h2>
                <p id="finalScoreText">Score: 3 (Par 6)</p>
            </div>
            <canvas id="courseMap" width="300" height="400"></canvas>
        </div>
        
        <p id="statusText" class="instructions">Choose your shot type to start!</p>
        <button id="generateBtn" class="btn-secondary">Generate Next Hole</button>
    </div>

    <script>
        // --- GAME STATE VARIABLES ---
        let currentHole = 1;
        let strokes = 0;
        let mulligans = 6;
        let currentRoll = 0;
        let canShoot = false;
        let isPutting = false;
        let isHoleComplete = false;
        let usedTeeOffReroll = false;
        
        let currentBallPos = { x: 0, y: 0 };
        let holePos = { x: 0, y: 0 };

        let gridData = [];

        // --- DOM ELEMENTS ---
        const rollBtn = document.getElementById('rollBtn');
        const puttBtn = document.getElementById('puttBtn');
        const rerollBtn = document.getElementById('rerollBtn');
        const diceResult = document.getElementById('diceResult');
        const statusText = document.getElementById('statusText');
        const strokeDisplay = document.getElementById('strokeDisplay');
        const holeDisplay = document.getElementById('holeDisplay');
        const mulliganDisplay = document.getElementById('mulliganDisplay');
        const generateBtn = document.getElementById('generateBtn');
        const victoryOverlay = document.getElementById('victoryOverlay');
        const finalScoreText = document.getElementById('finalScoreText');
        
        const canvas = document.getElementById('courseMap');
        const ctx = canvas.getContext('2d');

        const TILE_SIZE = 20;
        const COLS = canvas.width / TILE_SIZE;
        const ROWS = canvas.height / TILE_SIZE;

        const TERRAIN = {
            ROUGH: 0,
            FAIRWAY: 1,
            SAND: 2,
            WATER: 3,
            TREE: 4
        };

        const COLORS = {
            [TERRAIN.ROUGH]: '#e9f5e9',
            [TERRAIN.FAIRWAY]: '#90ee90',
            [TERRAIN.SAND]: '#f5deb3',
            [TERRAIN.WATER]: '#4682b4',
            [TERRAIN.TREE]: '#228b22',
            dot: 'rgba(0, 0, 0, 0.15)' 
        };

        // --- ACTION BUTTON LOGIC ---
        function animateDice(text) {
            diceResult.innerText = text;
            diceResult.style.transform = 'scale(1.3)';
            setTimeout(() => diceResult.style.transform = 'scale(1)', 150);
        }

        function updateRerollButton() {
            if (!canShoot || isPutting || isHoleComplete) {
                rerollBtn.disabled = true;
                rerollBtn.innerText = "Re-roll";
                return;
            }
            
            if (strokes === 0 && !usedTeeOffReroll) {
                rerollBtn.disabled = false;
                rerollBtn.innerText = "Free Re-roll";
            } else if (mulligans > 0) {
                rerollBtn.disabled = false;
                rerollBtn.innerText = `Mulligan (${mulligans})`;
            } else {
                rerollBtn.disabled = true;
                rerollBtn.innerText = "0 Mulligans";
            }
        }

        function calculateMaxDistance() {
            let cGridX = currentBallPos.x / TILE_SIZE;
            let cGridY = currentBallPos.y / TILE_SIZE;
            let currentTerrain = gridData[cGridY][cGridX];
            
            let effectiveRoll = currentRoll;
            let modifierText = "";
            
            if (currentTerrain === TERRAIN.FAIRWAY) {
                effectiveRoll += 1;
                modifierText = " (+1 Fairway Bonus)";
            } else if (currentTerrain === TERRAIN.SAND) {
                effectiveRoll = Math.max(1, currentRoll - 1);
                modifierText = " (-1 Sand Penalty)";
            }

            statusText.style.color = '#5cb85c'; 
            statusText.innerText = `Max distance: ${effectiveRoll}${modifierText}`;
        }

        rollBtn.addEventListener('click', () => {
            if (isHoleComplete) return;
            currentRoll = Math.floor(Math.random() * 6) + 1;
            animateDice(currentRoll);

            canShoot = true;
            isPutting = false;
            rollBtn.disabled = true; 
            puttBtn.disabled = true;
            
            calculateMaxDistance();
            updateRerollButton();
        });

        puttBtn.addEventListener('click', () => {
            if (isHoleComplete) return;
            currentRoll = 1; 
            animateDice('P');

            canShoot = true;
            isPutting = true;
            rollBtn.disabled = true;
            puttBtn.disabled = true;
            statusText.style.color = '#ff9500'; 
            statusText.innerText = "Tap an adjacent dot to putt.";
            
            updateRerollButton();
        });

        rerollBtn.addEventListener('click', () => {
            if (strokes === 0 && !usedTeeOffReroll) {
                usedTeeOffReroll = true;
            } else {
                mulligans--;
                mulliganDisplay.innerText = `Mulligans: ${mulligans}`;
            }
            
            currentRoll = Math.floor(Math.random() * 6) + 1;
            animateDice(currentRoll);
            
            rerollBtn.disabled = true;
            calculateMaxDistance();
        });

        // --- MAP GENERATION ---
        function generateCourse() {
            victoryOverlay.style.display = 'none';

            gridData = [];
            for(let y = 0; y <= ROWS; y++) {
                gridData[y] = [];
                for(let x = 0; x <= COLS; x++) {
                    gridData[y][x] = TERRAIN.ROUGH;
                }
            }

            let currentX = Math.floor(COLS / 2);
            let currentY = ROWS - 2;
            const startX = currentX;
            const startY = currentY;

            while (currentY > 2) {
                for(let fy = currentY - 1; fy <= currentY + 1; fy++) {
                    for(let fx = currentX - 1; fx <= currentX + 1; fx++) {
                        if(gridData[fy] && gridData[fy][fx] !== undefined) {
                            gridData[fy][fx] = TERRAIN.FAIRWAY;
                        }
                    }
                }
                
                let move = Math.random();
                if (move < 0.5) currentY -= 1;
                else if (move < 0.75 && currentX > 2) currentX -= 1;
                else if (currentX < COLS - 3) currentX += 1;
            }
            holePos = { x: currentX * TILE_SIZE, y: currentY * TILE_SIZE };

            for(let i = 0; i < 5; i++) {
                let isWater = Math.random() > 0.5;
                let type = isWater ? TERRAIN.WATER : TERRAIN.SAND;
                let hx = Math.floor(Math.random() * (COLS - 2)) + 1;
                let hy = Math.floor(Math.random() * (ROWS - 4)) + 2;
                
                for(let fy = hy; fy < hy
