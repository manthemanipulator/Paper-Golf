<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Paper Apps Golf Companion</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 { margin-top: 5px; margin-bottom: 5px; font-size: 22px; }
        
        .header-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 350px;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 16px;
            color: #2c3e50;
        }

        .dice-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            width: 100%;
            max-width: 350px;
        }
        #diceResult {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #2c3e50;
            transition: transform 0.1s;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }
        button {
            flex: 1;
            background-color: #007aff;
            color: white;
            border: none;
            padding: 12px 10px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            touch-action: manipulation;
        }
        button:active { background-color: #005bb5; }
        button:disabled {
            background-color: #cccccc !important;
            color: #666666 !important;
            cursor: not-allowed;
        }

        .btn-putt { background-color: #ff9500; }
        .btn-putt:active { background-color: #cc7700; }

        .btn-secondary {
            background-color: #34c759;
            margin-top: 10px;
            width: 100%;
        }
        .btn-secondary:active { background-color: #248a3d; }
        
        .map-container {
            background: white;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 350px;
            box-sizing: border-box;
        }
        
        .canvas-wrapper {
            position: relative;
            width: fit-content;
        }

        .victory-screen {
            display: none; 
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.9);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            z-index: 10;
        }
        .victory-screen h2 { color: #2c3e50; font-size: 28px; margin-bottom: 5px; }
        .victory-screen p { color: #666; font-size: 18px; font-weight: bold; }

        canvas {
            background-color: #fcfcfc;
            border: 1px solid #ddd;
            border-radius: 8px;
            touch-action: none; 
            cursor: crosshair;
            display: block; 
        }
        .instructions {
            font-size: 13px;
            color: #d9534f; 
            font-weight: bold;
            margin-top: 8px;
            margin-bottom: 4px;
            height: 18px; 
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>GOLF Companion</h1>
    
    <div class="header-bar">
        <span id="holeDisplay">Hole: 1</span>
        <span id="strokeDisplay">Strokes: 0</span>
    </div>

    <div class="dice-container">
        <div id="diceResult">-</div>
        <div class="button-group">
            <button id="rollBtn">Roll d6</button>
            <button id="puttBtn" class="btn-putt">Putt (1)</button>
        </div>
    </div>

    <div class="map-container">
        <div class="canvas-wrapper">
            <div id="victoryOverlay" class="victory-screen">
                <h2>IN THE HOLE!</h2>
                <p id="finalScoreText">Score: 3 (Par 6)</p>
            </div>
            <canvas id="courseMap" width="300" height="400"></canvas>
        </div>
        
        <p id="statusText" class="instructions">Choose your shot type to start!</p>
        <button id="generateBtn" class="btn-secondary">Generate Next Hole</button>
    </div>

    <script>
        // --- GAME STATE VARIABLES ---
        let currentHole = 1;
        let strokes = 0;
        let currentRoll = 0;
        let canShoot = false;
        let isPutting = false;
        let isHoleComplete = false;
        
        let currentBallPos = { x: 0, y: 0 };
        let holePos = { x: 0, y: 0 };

        // NEW: The internal data grid
        let gridData = [];

        // --- DOM ELEMENTS ---
        const rollBtn = document.getElementById('rollBtn');
        const puttBtn = document.getElementById('puttBtn');
        const diceResult = document.getElementById('diceResult');
        const statusText = document.getElementById('statusText');
        const strokeDisplay = document.getElementById('strokeDisplay');
        const holeDisplay = document.getElementById('holeDisplay');
        const generateBtn = document.getElementById('generateBtn');
        const victoryOverlay = document.getElementById('victoryOverlay');
        const finalScoreText = document.getElementById('finalScoreText');
        
        const canvas = document.getElementById('courseMap');
        const ctx = canvas.getContext('2d');

        const TILE_SIZE = 20;
        const COLS = canvas.width / TILE_SIZE;
        const ROWS = canvas.height / TILE_SIZE;

        const TERRAIN = {
            ROUGH: 0,
            FAIRWAY: 1,
            SAND: 2,
            WATER: 3,
            TREE: 4
        };

        const COLORS = {
            [TERRAIN.ROUGH]: '#e9f5e9',
            [TERRAIN.FAIRWAY]: '#90ee90',
            [TERRAIN.SAND]: '#f5deb3',
            [TERRAIN.WATER]: '#4682b4',
            [TERRAIN.TREE]: '#228b22',
            dot: 'rgba(0, 0, 0, 0.15)' 
        };

        // --- ACTION BUTTON LOGIC ---
        function animateDice(text) {
            diceResult.innerText = text;
            diceResult.style.transform = 'scale(1.3)';
            setTimeout(() => diceResult.style.transform = 'scale(1)', 150);
        }

        rollBtn.addEventListener('click', () => {
            if (isHoleComplete) return;
            currentRoll = Math.floor(Math.random() * 6) + 1;
            animateDice(currentRoll);

            canShoot = true;
            isPutting = false;
            rollBtn.disabled = true; 
            puttBtn.disabled = true;
            
            // Check current terrain to update prompt
            let cGridX = currentBallPos.x / TILE_SIZE;
            let cGridY = currentBallPos.y / TILE_SIZE;
            let currentTerrain = gridData[cGridY][cGridX];
            
            let effectiveRoll = currentRoll;
            let modifierText = "";
            
            if (currentTerrain === TERRAIN.FAIRWAY) {
                effectiveRoll += 1;
                modifierText = " (+1 Fairway Bonus)";
            } else if (currentTerrain === TERRAIN.SAND) {
                effectiveRoll = Math.max(1, currentRoll - 1);
                modifierText = " (-1 Sand Penalty)";
            }

            statusText.style.color = '#5cb85c'; 
            statusText.innerText = `Max distance: ${effectiveRoll}${modifierText}`;
        });

            if (isHoleComplete) return;
            currentRoll = 1;
